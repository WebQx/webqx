<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebQX — Sign in</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif; background:#0f172a; color:#e5e7eb; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:2rem; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:12px; padding:24px; max-width:740px; width:100%; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    h1 { font-size:1.25rem; margin:0 0 0.75rem; color:#93c5fd; }
    p { margin:0 0 1rem; color:#cbd5e1; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    a { color:#60a5fa; }
    .roles { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:12px; }
    .role { background:#0b1220; border:1px dashed #1f2937; border-radius:8px; padding:12px; }
    .muted { color:#94a3b8; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="card" role="region" aria-label="Choose how to sign in">
    <h1>Welcome to WebQX</h1>
    <p class="muted">This is the login home for all users. Pick your portal to continue:</p>
    <div class="roles">
      <div class="role"><strong>Patients</strong><br/><a href="/patient-portal/login.html">Patient portal login</a></div>
      <div class="role"><strong>Providers</strong><br/><a href="/auth/providers/login.html">Provider login</a></div>
      <div class="role"><strong>Admin/Staff</strong><br/><a href="/admin-console/">Admin console</a></div>
    </div>
    <p class="muted" style="margin-top:12px;">Single sign-on (Microsoft, Google, Apple, or your health record) is available on the specific login pages.</p>
  </div>
</body>
</html>
