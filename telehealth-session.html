<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Telehealth Session • WebQX</title>
  <style>
    body { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f172a; color:#f1f5f9; margin:0; padding:1.5rem; }
    a { color:#3b82f6; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width:1100px; margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    header h1 { font-size:1.15rem; margin:0; }
    .panel { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:1.1rem 1.35rem; margin-bottom:1rem; }
    .grid { display:grid; gap:1rem; }
    @media (min-width: 950px){ .grid { grid-template-columns: 2fr 1fr; } }
    .btn { background:#3b82f6; border:none; color:#fff; padding:.55rem .95rem; border-radius:8px; font-weight:600; cursor:pointer; font-size:.75rem; }
    .btn.secondary { background:#475569; }
    .btn.danger { background:#dc2626; }
    .btn:disabled { background:#475569; opacity:.5; cursor:not-allowed; }
    .meta { opacity:.6; font-size:.65rem; letter-spacing:.5px; text-transform:uppercase; }
    .pill { background:#334155; padding:.3rem .6rem; font-size:.6rem; border-radius:999px; letter-spacing:.5px; }
    ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.4rem; }
    li.participant { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); padding:.5rem .6rem; border-radius:8px; font-size:.7rem; }
    .log { font-family: 'Courier New', monospace; font-size:.65rem; background:rgba(0,0,0,.45); padding:.6rem .7rem; border-radius:8px; height:190px; overflow:auto; border:1px solid rgba(255,255,255,.08); }
    .row { display:flex; gap:.5rem; }
    input, textarea { background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:.55rem .65rem; color:#f8fafc; font-family:inherit; font-size:.75rem; }
    input:focus, textarea:focus { outline:2px solid #3b82f6; }
    textarea { resize:vertical; min-height:70px; }
    .statusBar { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.5rem; }
    .error { background:rgba(220,38,38,.15); border:1px solid #dc2626; padding:.6rem .75rem; border-radius:8px; font-size:.7rem; margin-bottom:.75rem; }
    .success { background:rgba(5,150,105,.15); border:1px solid #059669; padding:.6rem .75rem; border-radius:8px; font-size:.7rem; margin-bottom:.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 id="sessionTitle">Telehealth Session</h1>
        <div class="meta" id="sessionMeta">Loading session…</div>
      </div>
      <nav style="display:flex; gap:.5rem; flex-wrap:wrap;">
        <a href="/provider-portal-real.html" class="btn secondary">← Back Portal</a>
        <button id="refreshBtn" class="btn secondary">Refresh</button>
        <button id="leaveBtn" class="btn danger" disabled>Leave</button>
      </nav>
    </header>

    <div id="alertRegion"></div>

    <div class="grid">
      <div class="panel" id="sessionPanel">
        <h2 style="margin:0 0 .65rem; font-size:.95rem;">Session Details</h2>
        <div id="sessionDetails" class="meta">Initializing…</div>
        <h3 style="margin:.9rem 0 .4rem; font-size:.8rem;">Participants</h3>
        <ul id="participantList"><li class="meta">Loading…</li></ul>
        <div class="statusBar" id="statusBar"></div>
      </div>
      <div class="panel" id="messagingPanel">
        <h2 style="margin:0 0 .65rem; font-size:.95rem;">Messaging</h2>
        <div class="log" id="messageLog">(No messages yet)</div>
        <div style="margin-top:.6rem;" class="row">
          <input id="messageInput" placeholder="Type message…" style="flex:1;" disabled />
          <button id="sendMsgBtn" class="btn" disabled>Send</button>
        </div>
      </div>
    </div>

    <details class="panel" open>
      <summary style="cursor:pointer; font-weight:600;">Raw Session JSON</summary>
      <pre id="rawJson" style="margin:0;" class="meta">Loading…</pre>
    </details>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('id');
    const token = localStorage.getItem('providerAuthToken') || sessionStorage.getItem('providerAuthToken');
    if (!token) location.href = '/auth/providers/login.html';

    if (!sessionId) {
      document.getElementById('alertRegion').innerHTML = '<div class="error">Missing session id (?id=)</div>';
    }

    async function fetchStatus() {
      if (!sessionId) return;
      try {
        const res = await fetch(`/api/v1/telehealth/video/session/${encodeURIComponent(sessionId)}/status`, { headers:{ Authorization:`Bearer ${token}` }});
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message||'Status fetch failed');
        renderSession(data.data);
      } catch (e) {
        document.getElementById('alertRegion').innerHTML = `<div class="error">${e.message}</div>`;
      }
    }

    async function joinSession() {
      if (!sessionId) return; 
      try {
        const res = await fetch(`/api/v1/telehealth/video/session/${encodeURIComponent(sessionId)}/join`, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` }, body: JSON.stringify({}) });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message||'Join failed');
        document.getElementById('leaveBtn').disabled = false;
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendMsgBtn').disabled = false;
        pushLog('system','Joined session');
        await fetchStatus();
      } catch (e) {
        pushLog('error','Join: '+e.message);
      }
    }

    async function leaveSession() {
      try {
        const res = await fetch(`/api/v1/telehealth/video/session/${encodeURIComponent(sessionId)}/leave`, { method:'POST', headers:{ Authorization:`Bearer ${token}` }});
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message||'Leave failed');
        pushLog('system','Left session');
        document.getElementById('leaveBtn').disabled = true;
      } catch (e) {
        pushLog('error','Leave: '+e.message);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      try {
        const res = await fetch('/api/v1/telehealth/messaging/send', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` }, body: JSON.stringify({ sessionId, message: text })});
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message||'Send failed');
        pushLog('me', text);
        input.value = '';
      } catch (e) {
        pushLog('error','Send: '+e.message);
      }
    }

    function renderSession(meta) {
      document.getElementById('sessionTitle').textContent = 'Session '+ meta.sessionId;
      document.getElementById('sessionMeta').textContent = `${meta.status.toUpperCase()} • Created ${new Date(meta.createdAt).toLocaleTimeString()}`;
      document.getElementById('sessionDetails').innerHTML = `<div style="display:flex; gap:.5rem; flex-wrap:wrap;">
        <span class="pill">Status: ${meta.status}</span>
        <span class="pill">Type: ${meta.type}</span>
        <span class="pill">Participants: ${meta.participantCount}</span>
        <span class="pill">Max: ${meta.maxParticipants}</span>
      </div>`;
      document.getElementById('rawJson').textContent = JSON.stringify(meta, null, 2);
      // participants placeholder (server doesn't expose full list in status response currently)
      document.getElementById('participantList').innerHTML = `<li class="participant">Participant count: ${meta.participantCount}</li>`;
    }

    function pushLog(origin,msg){
      const log = document.getElementById('messageLog');
      if (log.textContent === '(No messages yet)') log.textContent = '';
      const line = document.createElement('div');
      line.innerHTML = `<strong style="color:${origin==='me'?'#3b82f6': origin==='error'?'#dc2626':'#93c5fd'};">${origin}</strong>: ${escapeHtml(msg)}`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    function escapeHtml(str){ return str.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

    document.getElementById('refreshBtn').addEventListener('click', fetchStatus);
    document.getElementById('leaveBtn').addEventListener('click', leaveSession);
    document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });

    // Auto-join on load then poll
    joinSession().then(()=>{
      setInterval(fetchStatus, 15000);
    });
  </script>
</body>
</html>
