name: Deploy EMR (OpenEMR) to Railway

on:
  push:
    branches: [ main ]
    paths:
      - 'webqx-emr-system/**'
      - '.github/workflows/backend-emr-railway-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy OpenEMR service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          EMR_SERVICE_NAME: webqx-emr
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret missing" >&2
            exit 1
          fi
          if [ -n "$RAILWAY_PROJECT_ID" ]; then
            railway link --project "$RAILWAY_PROJECT_ID" || true
          fi
          cd webqx-emr-system
          railway up --service "$EMR_SERVICE_NAME" --detach || railway up --detach

      - name: Post-deploy note
        run: echo "OpenEMR deploy triggered; set RAILWAY_PUBLIC_EMR_BASE secret to EMR public URL for Pages integration."
