name: WebQX CI (no deploy)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  WEBQX_VERSION: ${{ github.sha }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: junit.xml
          if-no-files-found: ignore

  # Build Docker images step removed from PR pipeline; release workflow handles versioned images

  # Pages deployment handled by dedicated workflows (staging/production)

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Summary
        run: echo 'CI run complete (tests only). Deployments occur via release workflows.'
