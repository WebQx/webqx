name: Secrets Preflight Validation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to validate"
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  validate:
    name: Validate required secrets (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run secrets validator
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          OAUTH2_ISSUER: ${{ secrets.OAUTH2_ISSUER }}
          OAUTH2_JWKS_URI: ${{ secrets.OAUTH2_JWKS_URI }}
          OAUTH2_CLIENT_ID: ${{ secrets.OAUTH2_CLIENT_ID }}
          OAUTH2_CLIENT_SECRET: ${{ secrets.OAUTH2_CLIENT_SECRET }}
          FHIR_BASE_URL: ${{ secrets.FHIR_BASE_URL }}
          PUBLIC_FHIR_BASE: ${{ secrets.PUBLIC_FHIR_BASE }}
          HIPAA_ENCRYPTION_KEY: ${{ secrets.HIPAA_ENCRYPTION_KEY }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          RABBITMQ_HEARTBEAT: ${{ secrets.RABBITMQ_HEARTBEAT }}
          RABBITMQ_CONNECTION_TIMEOUT: ${{ secrets.RABBITMQ_CONNECTION_TIMEOUT }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_SSL: ${{ secrets.REDIS_SSL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_PUBLIC_API_BASE: ${{ secrets.RAILWAY_PUBLIC_API_BASE }}
        run: |
          echo "Running required-secrets-check.js"
          node scripts/required-secrets-check.js
      - name: Output summary
        if: success()
        run: echo "✅ Secrets validation passed for ${{ inputs.environment }} environment."