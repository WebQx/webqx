name: Rollback Deployment
jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_API_TOKEN || secrets.RWY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || secrets.RWY_PROJECT_ID || secrets.RAILWAY_PROJECT }}
    steps:
      - name: Check Railway credentials
        id: railway-gate
        run: |
          if [ -z "${RAILWAY_TOKEN}" ] || [ -z "${RAILWAY_PROJECT_ID}" ]; then
            echo "::notice::Railway credentials not provided; skipping rollback automation."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.railway-gate.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install Railway CLI
        if: steps.railway-gate.outputs.skip == 'false'
        run: npm i -g @railway/cli

      - name: Load Railway secrets
        if: steps.railway-gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_API_TOKEN || secrets.RWY_TOKEN }}
        run: |
          echo "RAILWAY_TOKEN=$RAILWAY_TOKEN" >> $GITHUB_ENV
          echo "RAILWAY_PROJECT_ID=$RAILWAY_PROJECT_ID" >> $GITHUB_ENV

      - name: Link project (if provided)
        if: steps.railway-gate.outputs.skip == 'false'
        run: |
          railway link --project "$RAILWAY_PROJECT_ID" || true

      - name: Prepare rollback metadata
        if: steps.railway-gate.outputs.skip == 'false'
        run: |
          echo "API_IMG=ghcr.io/${{ github.repository_owner }}/webqx-api:${{ github.event.inputs.version || 'latest' }}" >> $GITHUB_ENV
          echo "EMR_IMG=ghcr.io/${{ github.repository_owner }}/webqx-emr:${{ github.event.inputs.version || 'latest' }}" >> $GITHUB_ENV

      - name: Redeploy API image
        if: steps.railway-gate.outputs.skip == 'false'
        run: |
          railway deploy --service webqx-api --image "${API_IMG}" --detach || true

      - name: Redeploy EMR image
        if: steps.railway-gate.outputs.skip == 'false'
        run: |
          railway deploy --service webqx-emr --image "${EMR_IMG}" --detach || true

      - name: Redeploy API & EMR (pinned images)
        run: |
          if [ -n "$RAILWAY_PROJECT_ID" ]; then railway link --project "$RAILWAY_PROJECT_ID" || true; fi
          VERSION="${{ inputs.version }}"
          OWNER_RAW="${{ github.repository_owner }}"
          OWNER=$(echo "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')
          API_IMG="ghcr.io/${OWNER}/webqx-api:${VERSION}"
          EMR_IMG="ghcr.io/${OWNER}/webqx-emr:${VERSION}"
          echo "Rolling back API to ${API_IMG}"
          railway deploy --service webqx-api --image "${API_IMG}" --detach || true
          echo "Rolling back EMR to ${EMR_IMG}"
          railway deploy --service webqx-emr --image "${EMR_IMG}" --detach || true

      - name: Re-deploy Pages from the tagged release artifact
        run: |
          echo "Rebuilding Pages from tag is optional; typically you deploy the previous Pages artifact if stored."
          echo "If needed, manually run the Deploy workflow on the tag to republish Pages."
