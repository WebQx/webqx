name: Configure Railway Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      configureEmr:
        description: "Also configure EMR service variables"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configure:
    name: Set Railway variables (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_API_TOKEN || secrets.RWY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || secrets.RWY_PROJECT_ID || secrets.RAILWAY_PROJECT }}
    steps:
      - name: Check Railway credentials
        id: railway-gate
        run: |
          if [ -z "${RAILWAY_TOKEN}" ] || [ -z "${RAILWAY_PROJECT_ID}" ]; then
            echo "::notice::Railway credentials not provided; skipping environment configuration."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.railway-gate.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install Node & Railway CLI
        if: steps.railway-gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        if: steps.railway-gate.outputs.skip == 'false'
        run: npm i -g @railway/cli@latest

      - name: Prepare token and link project
        if: steps.railway-gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_API_TOKEN || secrets.RWY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || secrets.RWY_PROJECT_ID || secrets.RAILWAY_PROJECT }}
        run: |
          set -e
          echo "RAILWAY_TOKEN=$RAILWAY_TOKEN" >> $GITHUB_ENV
          railway link --project "$RAILWAY_PROJECT_ID" || true

      - name: Configure variables for webqx-api (from environment secrets)
        if: steps.railway-gate.outputs.skip == 'false'
        env:
          # Core
          NODE_ENV: ${{ vars.NODE_ENV }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          HEALTH_CHECK_ENABLED: ${{ secrets.HEALTH_CHECK_ENABLED }}
          HEALTH_CHECK_TIMEOUT: ${{ secrets.HEALTH_CHECK_TIMEOUT }}
          STRUCTURED_LOGGING: ${{ secrets.STRUCTURED_LOGGING }}
          METRICS_ENABLED: ${{ secrets.METRICS_ENABLED }}
          # OAuth2 / Keycloak
          OAUTH2_ISSUER: ${{ secrets.OAUTH2_ISSUER }}
          OAUTH2_CLIENT_ID: ${{ secrets.OAUTH2_CLIENT_ID }}
          OAUTH2_CLIENT_SECRET: ${{ secrets.OAUTH2_CLIENT_SECRET }}
          OAUTH2_JWKS_URI: ${{ secrets.OAUTH2_JWKS_URI }}
          # EMR / FHIR
          USE_REMOTE_OPENEMR: ${{ secrets.USE_REMOTE_OPENEMR }}
          OPENEMR_REMOTE_URL: ${{ secrets.OPENEMR_REMOTE_URL }}
          OPENEMR_CLIENT_ID: ${{ secrets.OPENEMR_CLIENT_ID }}
          OPENEMR_CLIENT_SECRET: ${{ secrets.OPENEMR_CLIENT_SECRET }}
          FHIR_BASE_URL: ${{ secrets.FHIR_BASE_URL }}
          PUBLIC_FHIR_BASE: ${{ secrets.PUBLIC_FHIR_BASE }}
          # HIPAA / Compliance
          HIPAA_ENCRYPTION_KEY: ${{ secrets.HIPAA_ENCRYPTION_KEY }}
          AUDIT_LOG_PATH: ${{ secrets.AUDIT_LOG_PATH }}
          # Messaging / Cache
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          RABBITMQ_HEARTBEAT: ${{ secrets.RABBITMQ_HEARTBEAT }}
          RABBITMQ_CONNECTION_TIMEOUT: ${{ secrets.RABBITMQ_CONNECTION_TIMEOUT }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_SSL: ${{ secrets.REDIS_SSL }}
          # Public bases for logs/Pages runtime
          RAILWAY_PUBLIC_API_BASE: ${{ secrets.RAILWAY_PUBLIC_API_BASE }}
          RAILWAY_PUBLIC_EMR_BASE: ${{ secrets.RAILWAY_PUBLIC_EMR_BASE }}
        run: |
          set -e
          add() { [ -n "$2" ] && VARS+=("$1=$2"); }
          VARS=()
          add NODE_ENV "$NODE_ENV"
          add ALLOWED_ORIGINS "$ALLOWED_ORIGINS"
          add HEALTH_CHECK_ENABLED "$HEALTH_CHECK_ENABLED"
          add HEALTH_CHECK_TIMEOUT "$HEALTH_CHECK_TIMEOUT"
          add STRUCTURED_LOGGING "$STRUCTURED_LOGGING"
          add METRICS_ENABLED "$METRICS_ENABLED"
          add OAUTH2_ISSUER "$OAUTH2_ISSUER"
          add OAUTH2_CLIENT_ID "$OAUTH2_CLIENT_ID"
          add OAUTH2_CLIENT_SECRET "$OAUTH2_CLIENT_SECRET"
          add OAUTH2_JWKS_URI "$OAUTH2_JWKS_URI"
          add USE_REMOTE_OPENEMR "$USE_REMOTE_OPENEMR"
          add OPENEMR_REMOTE_URL "$OPENEMR_REMOTE_URL"
          add OPENEMR_CLIENT_ID "$OPENEMR_CLIENT_ID"
          add OPENEMR_CLIENT_SECRET "$OPENEMR_CLIENT_SECRET"
          add FHIR_BASE_URL "$FHIR_BASE_URL"
          add PUBLIC_FHIR_BASE "$PUBLIC_FHIR_BASE"
          add HIPAA_ENCRYPTION_KEY "$HIPAA_ENCRYPTION_KEY"
          add AUDIT_LOG_PATH "$AUDIT_LOG_PATH"
            add RABBITMQ_URL "$RABBITMQ_URL"
          add RABBITMQ_HEARTBEAT "$RABBITMQ_HEARTBEAT"
          add RABBITMQ_CONNECTION_TIMEOUT "$RABBITMQ_CONNECTION_TIMEOUT"
          add REDIS_URL "$REDIS_URL"
          add REDIS_SSL "$REDIS_SSL"
          add RAILWAY_PUBLIC_API_BASE "$RAILWAY_PUBLIC_API_BASE"
          add RAILWAY_PUBLIC_EMR_BASE "$RAILWAY_PUBLIC_EMR_BASE"
          if [ ${#VARS[@]} -eq 0 ]; then
            echo "No variables to set for webqx-api"
          else
            echo "Setting ${#VARS[@]} variables on service webqx-api"
            railway variables set --service webqx-api "${VARS[@]}"
          fi

      - name: Configure variables for webqx-emr (optional)
        if: steps.railway-gate.outputs.skip == 'false' && inputs.configureEmr == true
        env:
          EMR_BASE_URL: ${{ secrets.EMR_BASE_URL }}
        run: |
          set -e
          VARS=()
          [ -n "$EMR_BASE_URL" ] && VARS+=("EMR_BASE_URL=$EMR_BASE_URL")
          if [ ${#VARS[@]} -eq 0 ]; then
            echo "No variables to set for webqx-emr"
          else
            echo "Setting ${#VARS[@]} variables on service webqx-emr"
            railway variables set --service webqx-emr "${VARS[@]}"
          fi

      - name: Show status
        if: steps.railway-gate.outputs.skip == 'false'
        run: |
          railway status || true
