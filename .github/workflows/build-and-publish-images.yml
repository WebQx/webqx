name: Build & Publish Images (on Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: ver
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (EMR)
        id: meta_emr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}/webqx-emr
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha

      - name: Extract metadata (API Gateway)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}/webqx-api
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha

      - name: Extract metadata (Auth)
        id: meta_auth
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}/webqx-auth
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha

      - name: Build & push EMR
        uses: docker/build-push-action@v6
        with:
          context: webqx-emr-system
          file: webqx-emr-system/Dockerfile
          push: true
          tags: ${{ steps.meta_emr.outputs.tags }}
          labels: ${{ steps.meta_emr.outputs.labels }}

      - name: Build & push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Build & push Django Auth
        uses: docker/build-push-action@v6
        with:
          context: django-auth-backend
          push: true
          tags: ${{ steps.meta_auth.outputs.tags }}
          labels: ${{ steps.meta_auth.outputs.labels }}
