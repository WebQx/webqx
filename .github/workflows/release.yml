name: Release (semantic-release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm i -D semantic-release @semantic-release/{git,github,changelog,commit-analyzer,release-notes-generator}

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
