<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=index.html">
    <meta name="robots" content="noindex">
    <title>Moved</title>
    <script>
        (function(){
            try{
                var p=location.pathname;
                var b=p.slice(0,p.lastIndexOf('/')+1);
                location.replace(b+'index.html'+(location.hash||''));
            }catch(e){
                location.href='index.html';
            }
        })();
    </script>
    <style>
        body {
            font-family: system-ui, Segoe UI, Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #334155;
        }
    </style>
</head>

</body>
</html>
