<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">WebQx EMR</title>
  <desc id="desc">Stylized WebQx EMR wordmark with medical cross emblem</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="640" height="200" fill="none"/>
  <!-- Emblem -->
  <g transform="translate(40 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#g)"/>
    <g transform="translate(60 60)">
      <rect x="-14" y="-38" width="28" height="76" rx="6" fill="#00ffd5"/>
      <rect x="-38" y="-14" width="76" height="28" rx="6" fill="#00ffd5"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g transform="translate(190 80)">
    <text x="0" y="40" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#e5f4f7">Web</text>
    <text x="160" y="40" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#00ffd5">Q</text>
    <text x="206" y="40" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#e5f4f7">x</text>
    <text x="260" y="40" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#9adbe4">EMR</text>
  </g>
</svg>