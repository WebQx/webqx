<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebQx EMR Logo</title>
  <style>
    :root {
      --bg: #0b2a5a;
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .logo {
      width: min(90vw, 600px);
      height: auto;
      filter: drop-shadow(0 6px 24px rgba(0,0,0,0.35));
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <img class="logo" src="/assets/webqx-emr-logo.png" alt="WebQx EMR Logo" />
  <span class="sr-only">WebQx EMR</span>
</body>
</html>
