<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0;url=/" />
  <link rel="canonical" href="/" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif; background:#0f172a; color:#e5e7eb; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:2rem; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:12px; padding:24px; max-width:740px; width:100%; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    a { color:#60a5fa; }
  </style>
  <script>
    (function(){
  var target = '/';
      try { if (location.pathname !== target) location.replace(target); } catch (e) { location.href = target; }
    })();
  </script>
  <noscript>
  <meta http-equiv="refresh" content="0;url=/" />
  </noscript>
</head>
<body>
  <div class="card" role="alert" aria-live="polite">
    <h1>Redirecting…</h1>
  <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
  </div>
</body>
</html>
