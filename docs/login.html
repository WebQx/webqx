<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>WebQX Demo Login</title><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="./assets/demo.css"/><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#334155,#0f172a)}.panel{background:#11161c;border:1px solid #1f2932;padding:2rem 2.2rem;border-radius:14px;color:#d1d9e0;box-shadow:0 10px 40px -8px #000;max-width:420px;width:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto}.panel h1{margin:0 0 .25rem;font-size:1.4rem;color:#f1f5f9;font-weight:600;letter-spacing:.5px}.panel p.sub{margin:.1rem 0 1.2rem;font-size:.72rem;color:#74808b;text-transform:uppercase;letter-spacing:.9px}.field{margin-bottom:.9rem;display:flex;flex-direction:column;gap:.35rem}.field label{font-size:.7rem;letter-spacing:.6px;font-weight:600;color:#9fb4c7}.field input{background:#0d1217;border:1px solid #25313c;color:#f1f5f9;font-size:.8rem;padding:.55rem .65rem;border-radius:6px;font-family:inherit} .field input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.25)}button.primary{width:100%;background:#2563eb;border:1px solid #1d4ed8;color:#fff;padding:.65rem .9rem;font-size:.8rem;font-weight:600;border-radius:6px;cursor:pointer;letter-spacing:.5px;margin-top:.25rem}button.primary:hover{background:#1d4ed8}button.primary:active{background:#1943c1}.creds{background:#0d141a;border:1px solid #1b2530;padding:.75rem .9rem;margin:1.05rem 0 .2rem;border-radius:10px;font-size:.62rem;line-height:1.15rem}.creds h3{margin:0 0 .4rem;font-size:.63rem;font-weight:600;color:#9fb4c7;letter-spacing:.7px;text-transform:uppercase}.creds code{background:#182029;padding:.15rem .35rem;border-radius:4px;font-size:.6rem;color:#d9e3ec}.roles{display:flex;gap:.4rem;margin:.2rem 0 1rem}.roles button{flex:1 1 auto;background:#1a2530;color:#c7d3de;border:1px solid #283541;padding:.45rem .4rem;font-size:.62rem;border-radius:5px;cursor:pointer;letter-spacing:.4px} .roles button.active{background:#2563eb;border-color:#1d4ed8;color:#fff}.roles button:hover{background:#22303c}.mini-note{font-size:.55rem;color:#607080;margin-top:.75rem;line-height:1.1rem}.error{background:#3f1d28;border:1px solid #7f243b;color:#f8d7da;padding:.4rem .55rem;border-radius:6px;font-size:.58rem;margin:.4rem 0 .6rem;display:none}.session{background:#10251a;border:1px solid #1d3d2b;padding:.7rem .8rem;border-radius:8px;margin:.8rem 0;font-size:.63rem;display:none}a.inline{color:#60a5fa;text-decoration:none;font-size:.62rem}a.inline:hover{text-decoration:underline}.logout{background:#334155;border:1px solid #475569;color:#fff;padding:.45rem .65rem;font-size:.6rem;border-radius:5px;cursor:pointer;margin-top:.65rem;width:100%}.logout:hover{background:#475569}</style></head><body><div class="panel" id="panel"><h1>WebQX Demo Access</h1><p class="sub">v0.1.0 • STATIC CLIENT AUTH</p><div class="session" id="sessionBox"></div><div class="error" id="errBox"></div><div class="roles" id="roleTabs"><button data-role="patient" class="active">Patient</button><button data-role="provider">Provider</button><button data-role="admin">Admin</button></div><form id="loginForm"><div class="field"><label for="user">Username / Email</label><input id="user" autocomplete="username" required/></div><div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required/></div><button type="submit" class="primary">Sign In</button></form><div class="creds" id="credBox"><h3>Demo Credentials</h3><div id="credList"></div></div><p class="mini-note">No PHI. Client‑side session only. Use provided demo accounts to explore dashboard & module pages (patients, provider schedule, metrics, telehealth).<br/>Issues? Hard refresh (Ctrl+Shift+R).</p></div><script type="module">import { loginDemo,currentSession,logout,roleHome } from './auth.js';
const credSets={patient:[['demo@patient.com','patient123'],['patient','patient123']],provider:[['doctor@webqx.com','provider123'],['physician@webqx.com','demo123'],['doctor','provider123']],admin:[['admin@webqx.com','admin123'],['admin','admin123']]};
const credList=document.getElementById('credList');
const errBox=document.getElementById('errBox');
const sessionBox=document.getElementById('sessionBox');
const roleTabs=document.getElementById('roleTabs');
let activeRole='patient';
function renderCreds(){credList.innerHTML=credSets[activeRole].map(c=>`<div><code>${c[0]}</code> / <code>${c[1]}</code></div>`).join('');}
roleTabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;roleTabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeRole=b.dataset.role;renderCreds();});
renderCreds();
const form=document.getElementById('loginForm');
form.addEventListener('submit',e=>{e.preventDefault();errBox.style.display='none';const u=user.value.trim();const p=pass.value;const sess=loginDemo(u,p);if(!sess){errBox.textContent='Invalid demo credentials.';errBox.style.display='block';return;}sessionBox.innerHTML=`Signed in as <strong>${sess.user}</strong> <span style='opacity:.6'>(role: ${sess.role})</span><br/><button class='logout' id='logoutBtn'>Sign Out</button>`;sessionBox.style.display='block';document.getElementById('panel').classList.add('authed');form.style.display='none';document.getElementById('credBox').style.display='none';setTimeout(()=>{const qp=new URLSearchParams(window.location.search);const target=qp.get('redirect');window.location.href= target || roleHome(sess.role);},650);});
function checkExisting(){const sess=currentSession();if(!sess)return;form.style.display='none';document.getElementById('credBox').style.display='none';sessionBox.innerHTML=`Active session for <strong>${sess.user}</strong> (role: ${sess.role})<br/><br/><a class='inline' href='${roleHome(sess.role)}'>Continue →</a><br/><button class='logout' id='logoutBtn'>Sign Out</button>`;sessionBox.style.display='block';}
checkExisting();
window.addEventListener('click',e=>{if(e.target.id==='logoutBtn'){logout();}});
</script></body></html>
